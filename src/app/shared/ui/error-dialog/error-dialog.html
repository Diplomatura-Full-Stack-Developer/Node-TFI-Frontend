<div class="flex flex-col gap-4 p-6">
  <p class="text-accent-700 text-center font-bold text-xl">{{ data.title }}</p>
  @if (data.message) {
    <p class="text-black/80 font-bold text-start">
      {{ data.message }}
    </p>
  }
  <button
    type="button"
    [mat-dialog-close]="data.buttonText === 'Mantener sesión abierta' ? 'refresh' : undefined"
    class="bg-primary-500 text-white rounded-md p-2 cursor-pointer font-bold"
  >
    {{ data.buttonText ?? 'Aceptar' }}
  </button>
</div>
